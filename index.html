<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0A0A0A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ISHA Hiring">
<title>ISHA Hiring Process</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  /* ISHA Brand Theme — Black / Red / Silver */
  --P:#0A0A0A;--Pd:#000000;--Pl:rgba(10,10,10,.12);
  --A:#E31E24;--Al:rgba(227,30,36,.12);          /* ISHA Red */
  --G:#16A34A;--Gl:rgba(22,163,74,.12);
  --R:#E31E24;--Rl:rgba(227,30,36,.12);
  --O:#D97706;--Ol:rgba(217,119,6,.12);
  --T:#8B8B8B;--Tl:rgba(139,139,139,.12);        /* Silver/gray */
  --V:#7C3AED;--Vl:rgba(124,58,237,.12);
  --bg:#F1F5F9;--sur:#fff;--sur2:#F8FAFC;
  --bdr:#E2E8F0;--tx:#0F172A;--tx2:#475569;--tx3:#94A3B8;
  --r:14px;--rS:10px;
  --sh:0 1px 4px rgba(0,0,0,.08);--shM:0 8px 24px rgba(0,0,0,.14);
  --topbar-h:56px;--bnav-h:62px;--sbw:272px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;padding:0;height:100%;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:14px;color:var(--tx);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased}

/* ── LOGIN ── */
#sLogin{position:fixed;inset:0;background:linear-gradient(160deg,#000000,#0A0A0A,#1a0000);display:flex;flex-direction:column;z-index:1000;overflow-y:auto}
.login-hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top,48px) 24px 24px;min-height:220px}
.login-logo-wrap{width:160px;padding:12px 16px;background:rgba(255,255,255,.06);border-radius:16px;margin-bottom:20px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.08)}
.login-logo-wrap img{width:130px;height:auto}
.login-app-sub{font-size:11px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.14em;margin-bottom:4px}
.login-tagline{font-size:13px;color:rgba(255,255,255,.5);margin-top:4px}
.login-form-wrap{background:#fff;border-radius:28px 28px 0 0;padding:28px 24px calc(env(safe-area-inset-bottom,0px) + 32px)}
.login-form-wrap h2{margin:0 0 6px;font-size:18px;font-weight:700;color:var(--tx)}
.login-form-wrap p{margin:0 0 20px;font-size:12px;color:var(--tx3)}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fg label{font-size:11px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.05em}
.fg input,.fg select,.fg textarea{padding:13px 14px;border:1.5px solid var(--bdr);border-radius:var(--rS);font-size:14px;outline:none;background:var(--sur2);color:var(--tx);width:100%;-webkit-appearance:none;transition:border .2s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--A);background:#fff;box-shadow:0 0 0 3px var(--Al)}
.fg textarea{resize:vertical;min-height:80px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn-login{width:100%;padding:15px;background:var(--A);color:#fff;border:none;border-radius:var(--rS);font-size:16px;font-weight:700;cursor:pointer;-webkit-appearance:none;letter-spacing:.02em}
.btn-login:active{background:#c0181d}
.login-err{color:var(--R);font-size:13px;text-align:center;min-height:20px;margin-top:12px;font-weight:500}
.login-powered{text-align:center;margin-top:16px;font-size:11px;color:var(--tx3)}

/* ── APP SHELL ── */
#sApp{display:none}
#topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar-h);background:#0A0A0A;display:flex;align-items:center;gap:4px;padding:env(safe-area-inset-top,0px) 8px 0 4px;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.4);border-bottom:1px solid #E31E24}
.tb-menu-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;font-size:18px;color:#fff;flex-shrink:0}
.tb-menu-btn:active{background:rgba(255,255,255,.1)}
.tb-logo{height:28px;width:auto;margin-left:2px}
#tbTitle{font-size:15px;font-weight:600;color:rgba(255,255,255,.5);flex:1;padding-left:8px}
.tb-action-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:rgba(255,255,255,.7);font-size:15px;cursor:pointer;flex-shrink:0}
.tb-action-btn:active{background:rgba(255,255,255,.1)}

/* ── SIDEBAR ── */
#sbOv{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200}
#sbOv.on{display:block}
#sb{position:fixed;top:0;left:0;bottom:0;width:var(--sbw);background:#0A0A0A;z-index:201;transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;overflow:hidden;border-right:1px solid #1a1a1a}
#sb.open{transform:translateX(0)}
.sb-brand{padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 16px;border-bottom:1px solid #1a1a1a;display:flex;align-items:center;gap:12px}
.sb-brand img{height:30px;width:auto}
.sb-brand-divider{width:1px;height:24px;background:#2a2a2a}
.sb-brand-label{font-size:11px;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.1em}
.sb-user{padding:14px 20px 16px;border-bottom:1px solid #1a1a1a}
.sb-avatar{width:38px;height:38px;background:#E31E24;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;margin-bottom:8px}
.sb-name{font-size:14px;font-weight:600;color:#fff;margin-bottom:2px}
.sb-email{font-size:11px;color:rgba(255,255,255,.4);margin-bottom:4px}
.sb-role{display:inline-block;padding:2px 8px;background:#E31E24;border-radius:10px;font-size:10px;color:#fff;font-weight:700;letter-spacing:.04em}
.sb-nav{flex:1;overflow-y:auto;padding:8px 0}
.nav-item{display:flex;align-items:center;gap:14px;padding:13px 20px;cursor:pointer;color:rgba(255,255,255,.5);font-size:14px;font-weight:500;position:relative;transition:color .15s}
.nav-item.on{color:#fff;background:rgba(227,30,36,.12)}
.nav-item.on::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:3px;background:#E31E24;border-radius:0 3px 3px 0}
.nav-item:active{background:rgba(255,255,255,.05)}
.nav-ico{font-size:18px;width:24px;text-align:center}
.sb-signout{padding:16px 20px;border-top:1px solid #1a1a1a;cursor:pointer;color:rgba(255,255,255,.35);font-size:13px;font-weight:500;display:flex;align-items:center;gap:10px}
.sb-signout:active{color:#E31E24}

/* ── BOTTOM NAV ── */
#bnav{position:fixed;bottom:0;left:0;right:0;min-height:var(--bnav-h);height:calc(var(--bnav-h) + env(safe-area-inset-bottom,0px));background:#0A0A0A;border-top:1px solid #1a1a1a;z-index:100;display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:rgba(255,255,255,.35);font-size:9px;font-weight:600;text-transform:uppercase}
.bn-item span{font-size:20px;line-height:1}
.bn-item.on{color:#E31E24}

/* ── CONTENT ── */
#content{position:fixed;top:var(--topbar-h);left:0;right:0;bottom:var(--bnav-h);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px 8px;background:var(--bg)}
.view{display:none}

/* ── CARDS ── */
.card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:14px;overflow:hidden}
.card-head{padding:14px 16px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-title{font-size:14px;font-weight:600;color:var(--tx);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-body{padding:16px}

/* ── KPI ── */
.kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);padding:14px;position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--kc,var(--A))}
.kpi-ico{width:36px;height:36px;border-radius:10px;background:var(--kib,var(--Al));display:flex;align-items:center;justify-content:center;font-size:15px;margin-bottom:10px}
.kpi-val{font-size:24px;font-weight:800;line-height:1;margin-bottom:3px}
.kpi-lbl{font-size:11px;font-weight:600;color:var(--tx2)}

/* ── HOME TILES ── */
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.home-tile{background:var(--sur);border-radius:var(--r);padding:18px 14px 14px;cursor:pointer;box-shadow:var(--sh);border:1px solid var(--bdr);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:10px;min-height:110px}
.home-tile::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--tc,var(--A))}
.home-tile:active{transform:scale(.97)}
.ht-ico{width:44px;height:44px;border-radius:12px;background:var(--tib,var(--Al));display:flex;align-items:center;justify-content:center;font-size:20px}
.ht-name{font-size:13px;font-weight:700;color:var(--tx)}
.ht-sub{font-size:11px;color:var(--tx3);margin-top:-6px}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:700}
.bg{background:var(--Gl);color:var(--G)}
.br{background:var(--Rl);color:var(--R)}
.bb{background:var(--Al);color:var(--A)}
.bo{background:var(--Ol);color:var(--O)}
.bv{background:var(--Vl);color:var(--V)}
.bt{background:var(--Tl);color:var(--T)}
.bx{background:var(--sur2);color:var(--tx3)}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:11px 18px;border-radius:var(--rS);border:none;font-size:13px;font-weight:600;cursor:pointer;-webkit-appearance:none;font-family:inherit}
.btn:active{opacity:.8}
.btnP{background:#0A0A0A;color:#fff}
.btnA{background:var(--A);color:#fff}
.btnG{background:var(--G);color:#fff}
.btnR{background:var(--R);color:#fff}
.btnO{background:var(--sur);color:var(--tx2);border:1.5px solid var(--bdr)}
.btn-sm{padding:8px 14px;font-size:12px}
.btn-full{width:100%;justify-content:center}

/* ── MODAL ── */
#mOv{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:500;backdrop-filter:blur(3px)}
#mOv.on{display:block}
#modal{display:none;position:fixed;bottom:0;left:0;right:0;z-index:501;background:var(--sur);border-radius:20px 20px 0 0;max-height:88vh;flex-direction:column;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
#modal.on{transform:translateY(0)}
.modal-hdr{display:flex;align-items:center;padding:18px 18px 10px;border-bottom:1px solid var(--bdr)}
.modal-hdr h3{flex:1;margin:0;font-size:16px;font-weight:700;color:var(--tx)}
.modal-close{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--sur2);cursor:pointer;font-size:18px;border:none;color:var(--tx2)}
.modal-body{flex:1;overflow-y:auto;padding:18px;-webkit-overflow-scrolling:touch}
.modal-foot{padding:14px 18px;border-top:1px solid var(--bdr)}

/* ── TOAST ── */
#toast{position:fixed;bottom:calc(var(--bnav-h) + env(safe-area-inset-bottom,0px) + 12px);left:50%;transform:translateX(-50%) translateY(16px);background:#0A0A0A;color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:500;z-index:9999;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;max-width:calc(100vw - 32px);text-align:center;border:1px solid #E31E24}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── ALERTS ── */
.alert-strip{border-radius:var(--rS);padding:11px 14px;font-size:13px;display:flex;align-items:center;gap:10px;margin-bottom:14px;font-weight:500;border-left:4px solid}
.alert-strip.ok{background:var(--Gl);color:var(--G);border-color:var(--G)}
.alert-strip.warn{background:var(--Ol);color:var(--O);border-color:var(--O)}
.alert-strip.info{background:var(--Al);color:var(--A);border-color:var(--A)}

/* ── RED ACCENT on card top borders ── */
.card-head{border-left:3px solid #E31E24}

/* ── DESKTOP ── */
@media(min-width:1024px){
  :root{--topbar-h:58px;--bnav-h:0px}
  #bnav{display:none}
  #sb{position:fixed;transform:translateX(0) !important;transition:none}
  #sbOv{display:none !important}
  .tb-menu-btn{display:none !important}
  #content{left:var(--sbw);padding:24px;bottom:0}
  #topbar{left:var(--sbw)}
  .kpi-row{grid-template-columns:repeat(4,1fr);gap:14px}
  .home-grid{grid-template-columns:repeat(4,1fr);gap:16px}
  .form-row{grid-template-columns:1fr 1fr}
  #modal{position:fixed;top:50%;bottom:auto;left:50%;right:auto;border-radius:16px;width:calc(100% - 40px);max-width:520px;transform:translate(-50%,-60%);max-height:85vh}
  #modal.on{transform:translate(-50%,-50%)}
  #toast{bottom:24px}
}
@media(min-width:768px) and (max-width:1023px){
  .kpi-row{grid-template-columns:repeat(4,1fr)}
  .home-grid{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
