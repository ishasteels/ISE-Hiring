<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0F172A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ISHA Hiring">
<title>ISHA Hiring Portal</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root {
  /* Common Token Base */
  --font-main: 'Segoe UI', system-ui, -apple-system, sans-serif;
  --r-base: 6px;
  --r-smooth: 4px;
  --transition: all 0.2s ease-in-out;
  --sbw-expanded: 260px;
  --sbw-collapsed: 68px;
  --topbar-h: 56px;
}

/* Light Theme Variables */
[data-theme="light"] {
  --bg-app: #F8FAFC;
  --bg-surface: #FFFFFF;
  --bg-surface-muted: #F1F5F9;
  --border-color: #E2E8F0;
  --text-main: #0F172A;
  --text-muted: #475569;
  --text-disabled: #94A3B8;
  --brand-primary: #1E293B;
  --brand-accent: #E31E24;
  --bg-sidebar: #0F172A;
  --text-sidebar: #94A3B8;
  --text-sidebar-active: #FFFFFF;
  
  --color-success: #16A34A;
  --color-warning: #D97706;
  --color-error: #DC2626;
  --color-info: #2563EB;
}

/* Dark Theme Variables */
[data-theme="dark"] {
  --bg-app: #0B0F19;
  --bg-surface: #111827;
  --bg-surface-muted: #1F2937;
  --border-color: #374151;
  --text-main: #F3F4F6;
  --text-muted: #9CA3AF;
  --text-disabled: #6B7280;
  --brand-primary: #F3F4F6;
  --brand-accent: #EF4444;
  --bg-sidebar: #111827;
  --text-sidebar: #9CA3AF;
  --text-sidebar-active: #FFFFFF;
  
  --color-success: #34D399;
  --color-warning: #F59E0B;
  --color-error: #EF4444;
  --color-info: #60A5FA;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-main); }
body { background: var(--bg-app); color: var(--text-main); height: 100vh; overflow: hidden; font-size: 13px; transition: var(--transition); }

/* ── LOGIN INTERFACE ── */
#sLogin { position: fixed; inset: 0; background: #0F172A; display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
.login-card { background: #FFFFFF; width: 100%; max-width: 400px; padding: 32px; border-radius: var(--r-base); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); color: #0F172A; }
.login-header { text-align: center; margin-bottom: 24px; }
.login-header img { height: 44px; margin-bottom: 12px; }
.login-header h2 { font-size: 20px; font-weight: 600; color: #1E293B; }
.login-header p { font-size: 12px; color: #64748B; margin-top: 4px; }

/* Form Controls */
.fg { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.fg label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
.fg input, .fg select, .fg textarea { padding: 10px 12px; border: 1px solid var(--border-color); border-radius: var(--r-smooth); font-size: 13px; background: var(--bg-surface); color: var(--text-main); outline: none; transition: var(--transition); width: 100%; }
.fg input:focus, .fg select:focus, .fg textarea:focus { border-color: var(--brand-accent); box-shadow: 0 0 0 2px var(--border-color); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* Buttons & Components */
.btn { inline-flex: align-items: center; justify-content: center; padding: 10px 16px; font-size: 12px; font-weight: 600; border-radius: var(--r-smooth); border: 1px solid transparent; cursor: pointer; transition: var(--transition); }
.btn-primary { background: var(--text-main); color: var(--bg-app); }
.btn-primary:hover { opacity: 0.9; }
.btn-secondary { background: transparent; border-color: var(--border-color); color: var(--text-main); }
.btn-secondary:hover { background: var(--bg-surface-muted); }
.btn-danger { background: var(--color-error); color: #FFF; }

/* ── MAIN APPLICATION ARCHITECTURE ── */
#sApp { display: none; height: 100vh; }

/* Top Navigation Bar */
#topbar { position: fixed; top: 0; left: var(--sbw-expanded); right: 0; height: var(--topbar-h); background: var(--bg-surface); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; z-index: 90; transition: var(--transition); }
body.sidebar-collapsed #topbar { left: var(--sbw-collapsed); }
#tbTitle { font-size: 16px; font-weight: 600; }
.topbar-actions { display: flex; gap: 12px; align-items: center; }

/* Sidebar Navigation (ERPNext Style Minimalist) */
#sb { position: fixed; top: 0; left: 0; bottom: 0; width: var(--sbw-expanded); background: var(--bg-sidebar); color: var(--text-sidebar); z-index: 100; display: flex; flex-direction: column; transition: var(--transition); }
body.sidebar-collapsed #sb { width: var(--sbw-collapsed); }

.sb-header { height: var(--topbar-h); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,0.1); }
.sb-logo-text { font-weight: 700; color: #FFF; font-size: 15px; letter-spacing: 0.5px; overflow: hidden; white-space: nowrap; }
body.sidebar-collapsed .sb-logo-text { display: none; }
.sb-toggle { background: transparent; border: none; color: #FFF; cursor: pointer; font-size: 16px; }

.sb-user-profile { padding: 16px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; gap: 12px; overflow: hidden; }
.sb-avatar { width: 32px; height: 32px; background: var(--brand-accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; color: #FFF; flex-shrink: 0; }
.sb-user-meta { display: flex; flex-direction: column; transition: var(--transition); }
body.sidebar-collapsed .sb-user-meta { display: none; }
.sb-username { color: #FFF; font-weight: 600; font-size: 13px; }
.sb-role { font-size: 10px; color: var(--text-sidebar); text-transform: uppercase; margin-top: 2px; }

.sb-nav { flex: 1; padding: 16px 8px; display: flex; flex-direction: column; gap: 4px; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--r-smooth); cursor: pointer; font-weight: 500; transition: var(--transition); color: var(--text-sidebar); }
.nav-item:hover, .nav-item.on { background: rgba(255,255,255,0.08); color: var(--text-sidebar-active); }
.nav-text { white-space: nowrap; }
body.sidebar-collapsed .nav-text { display: none; }

.sb-footer { padding: 12px; border-top: 1px solid rgba(255,255,255,0.05); }
.btn-logout { width: 100%; display: flex; align-items: center; gap: 8px; background: transparent; border: none; color: var(--text-sidebar); padding: 8px; cursor: pointer; font-size: 12px; text-align: left; }
body.sidebar-collapsed .btn-logout span { display: none; }

/* Content Main Container */
#content { position: fixed; top: var(--topbar-h); left: var(--sbw-expanded); right: 0; bottom: 0; overflow-y: auto; padding: 24px; transition: var(--transition); }
body.sidebar-collapsed #content { left: var(--sbw-collapsed); }
.view { display: none; max-width: 1200px; margin: 0 auto; }

/* ── GRID SYSTEM & CARDS (SaaS Style) ── */
.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
.kpi-card { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--r-base); padding: 20px; display: flex; flex-direction: column; gap: 8px; }
.kpi-title { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
.kpi-value { font-size: 24px; font-weight: 700; color: var(--text-main); }

/* Data Tables & Filters */
.toolbar { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.search-input { flex: 1; min-width: 200px; }

.data-table-container { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--r-base); overflow: hidden; margin-bottom: 24px; }
.data-table { width: 100%; border-collapse: collapse; text-align: left; }
.data-table th { background: var(--bg-surface-muted); padding: 12px 16px; font-weight: 600; border-bottom: 1px solid var(--border-color); color: var(--text-muted); }
.data-table td { padding: 14px 16px; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { background: var(--bg-surface-muted); }

/* Badges system minimal */
.badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 500; }
.badge-success { background: rgba(22,163,74,0.1); color: var(--color-success); }
.badge-warning { background: rgba(217,119,6,0.1); color: var(--color-warning); }
.badge-error { background: rgba(220,26,26,0.1); color: var(--color-error); }
.badge-info { background: rgba(37,99,235,0.1); color: var(--color-info); }

/* Modal & Toast Base styling */
#mOv { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 500; backdrop-filter: blur(2px); }
#modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--r-base); width: 90%; max-width: 550px; max-height: 85vh; flex-direction: column; z-index: 501; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
.modal-hdr { padding: 16px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
.modal-body { padding: 20px; overflow-y: auto; }
.modal-foot { padding: 14px 20px; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; gap: 12px; }

#toast { position: fixed; bottom: 24px; right: 24px; background: #1E293B; color: #FFF; padding: 12px 20px; border-radius: var(--r-smooth); font-size: 12px; font-weight: 500; z-index: 9999; transform: translateY(100px); opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); pointer-events: none; }
#toast.on { opacity: 1; transform: translateY(0); }

/* ── RESPONSIVE ADAPTATION (Mobile & Tablet Layouts) ── */
@media (max-width: 1023px) {
  :root { --sbw-expanded: 240px; }
  body:not(.sidebar-collapsed) #sb { transform: translateX(0); }
  body.sidebar-collapsed #sb { transform: translateX(-100%); }
  #topbar { left: 0 !important; }
  #content { left: 0 !important; padding: 16px; }
  .sb-toggle-mobile { display: block !important; }
}
</style>
</head>
<body data-theme="light">

<div id="sLogin">
  <div class="login-card">
    <div class="login-header">
      <h2>ISHA Portal</h2>
      <p>Recruitment & Talent Management Architecture</p>
    </div>
    <div class="fg">
      <label>Email Address</label>
      <input id="loginEmail" type="email" placeholder="name@ise.in">
    </div>
    <div class="fg">
      <label>Password</label>
      <input id="loginPass" type="password" placeholder="••••••••">
    </div>
    <button class="btn btn-primary" style="width:100%; padding:12px;" onclick="doLogin()" id="loginBtn">Authenticate</button>
    <div class="login-err" id="loginErr" style="color:var(--color-error); font-size:12px; text-align:center; margin-top:12px; font-weight:500;"></div>
  </div>
</div>

<div id="sApp">
  <div id="sb">
    <div class="sb-header">
      <div class="sb-logo-text">ISHA SYSTEMS</div>
      <button class="sb-toggle" onclick="toggleSidebar()">⇦</button>
    </div>
    <div class="sb-user-profile">
      <div class="sb-avatar" id="sbAvatar">U</div>
      <div class="sb-user-meta">
        <span class="sb-username" id="sbUserName">—</span>
        <span class="sb-role" id="sbUserRole">—</span>
      </div>
    </div>
    <nav class="sb-nav">
      <div class="nav-item on" data-v="home" onclick="_lv('home')"><span class="nav-text">Dashboard</span></div>
      <div class="nav-item" data-v="jobs" onclick="_lv('jobs')"><span class="nav-text">Job Openings</span></div>
      <div class="nav-item" data-v="candidates" onclick="_lv('candidates')"><span class="nav-text">Candidates</span></div>
      <div class="nav-item" data-v="interviews" onclick="_lv('interviews')"><span class="nav-text">Interviews</span></div>
      <div class="nav-item" data-v="offers" onclick="_lv('offers')"><span class="nav-text">Offer Letters</span></div>
    </nav>
    <div class="sb-footer">
      <button class="btn-logout" onclick="_signOut()">🚪 <span>Sign Out</span></button>
    </div>
  </div>

  <div id="topbar">
    <div style="display:flex; align-items:center; gap:12px;">
      <button class="btn btn-secondary sb-toggle-mobile" style="display:none; padding:6px 10px;" onclick="toggleSidebar()">☰</button>
      <h1 id="tbTitle">Dashboard</h1>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-secondary" style="padding:6px 12px;" onclick="toggleTheme()">Dark Mode</button>
      <button class="btn btn-secondary" style="padding:6px 12px;" onclick="_refresh()">Sync</button>
    </div>
  </div>

  <div id="content">
    <div id="v-home" class="view"></div>
    <div id="v-jobs" class="view"></div>
    <div id="v-candidates" class="view"></div>
    <div id="v-interviews" class="view"></div>
    <div id="v-offers" class="view"></div>
  </div>
</div>

<div id="mOv" onclick="_closeModal()"></div>
<div id="modal">
  <div class="modal-hdr">
    <h3 id="mTitle">Control Form</h3>
    <button class="btn btn-secondary" style="padding:4px 8px;" onclick="_closeModal()">✕</button>
  </div>
  <div class="modal-body" id="mBody"></div>
  <div class="modal-foot" id="mFoot"></div>
</div>

<div id="toast">System Status Update</div>

<script src="app.js"></script>
</body>
</html>
